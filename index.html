<title>MODライブラリ</title>
<style>
/* Layout: one narrow column that narrows down step by step — mod list, then Minecraft version, then mod version, then the download block. */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --fg: #1d2420;
  --muted: #5d6862;
  --line: #d9ded9;
  --accent: #2c7a57;
  --accent-soft: #e3f1ea;
  --accent-fg: #ffffff;
  --warn-bg: #fff4dc;
  --warn-fg: #7a5410;
  --font-display: system-ui, sans-serif;
  --font-body: system-ui, sans-serif;
  --font-mono: system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151a17; --surface: #1d2420; --fg: #e6ebe7; --muted: #9aa69f; --line: #2f3833;
    --accent: #5cc493; --accent-soft: #1f3a2d; --accent-fg: #0f1a14; --warn-bg: #3a2f17; --warn-fg: #f2cd83;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151a17; --surface: #1d2420; --fg: #e6ebe7; --muted: #9aa69f; --line: #2f3833;
  --accent: #5cc493; --accent-soft: #1f3a2d; --accent-fg: #0f1a14; --warn-bg: #3a2f17; --warn-fg: #f2cd83;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.75;
}
.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 36px 56px;
  display: grid;
  gap: 28px;
}
header { display: grid; gap: 8px; }
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(30px, 6vw, 42px);
  line-height: 1.15;
  margin: 0;
}
.lead { margin: 0; color: var(--muted); max-width: 60ch; }
h2 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 20px;
  margin: 0;
  text-wrap: balance;
}
.step { display: grid; gap: 12px; }
.step-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.step-no {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--accent);
  letter-spacing: 0.06em;
}
.hint { color: var(--muted); font-size: 13.5px; margin: 0; }

/* mod cards */
.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.mod-card {
  font: inherit;
  color: inherit;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px;
  display: grid;
  gap: 8px;
  cursor: pointer;
  min-width: 0;
}
.mod-card:hover { border-color: var(--accent); }
.mod-card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mod-card[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.mod-card .name { font-family: var(--font-display); font-size: 20px; line-height: 1.2; }
.mod-card .sum { color: var(--muted); font-size: 13.5px; line-height: 1.6; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip {
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.6;
  display: inline-flex;
  align-items: center;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--fg);
}
.chip.warn { background: var(--warn-bg); color: var(--warn-fg); font-family: var(--font-body); }
.chip.count { font-family: var(--font-body); }

/* option buttons */
.options { display: flex; flex-wrap: wrap; gap: 8px; }
.opt {
  font: inherit;
  font-size: 14px;
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 14px;
  cursor: pointer;
  display: inline-flex;
  gap: 8px;
  align-items: baseline;
}
.opt:hover { border-color: var(--accent); }
.opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.opt .sub { font-family: var(--font-mono); font-size: 11.5px; opacity: 0.8; }

/* mod details */
.details {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 18px;
  display: grid;
  gap: 14px;
}
.details h3 { margin: 0; font-size: 15px; }
.feature { display: grid; grid-template-columns: 8.5em minmax(0, 1fr); gap: 10px; font-size: 14px; }
.feature b { font-weight: 700; }
.feature span { color: var(--muted); }
.back {
  font: inherit;
  font-size: 13.5px;
  color: var(--accent);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  justify-self: start;
}
.back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* download block */
.download {
  background: var(--surface);
  border: 2px solid var(--accent);
  border-radius: 8px;
  padding: 20px;
  display: grid;
  gap: 14px;
}
.status {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  background: var(--warn-bg);
  color: var(--warn-fg);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 13.5px;
  line-height: 1.6;
}
.status b { white-space: nowrap; }.row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
button.dl, a.dl { display:inline-block; text-decoration:none;

  font: inherit;
  font-weight: 700;
  font-size: 15px;
  background: var(--accent);
  color: var(--accent-fg);
  border: 0;
  border-radius: 6px;
  padding: 12px 22px;
  cursor: pointer;
}
button.dl:hover, a.dl:hover { filter: brightness(1.08); }
button.dl:focus-visible, a.dl:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
button.dl:disabled { opacity: 0.5; cursor: default; filter: none; }
.msg { font-size: 13.5px; color: var(--muted); }
.msg.ok { color: var(--accent); }
.msg.err { color: var(--warn-fg); }
dl.file {
  margin: 0;
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 4px 16px;
  font-size: 13px;
}
dl.file dt { color: var(--muted); }
dl.file dd { margin: 0; font-family: var(--font-mono); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
ol.steps { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; font-size: 14px; }
code {
  font-family: var(--font-mono);
  font-size: 0.9em;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0 5px;
}

/* folders (その他 → アドオン) */
.crumbs { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; font-size: 13.5px; color: var(--muted); }
.crumbs button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
.crumbs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.crumbs .here { color: var(--fg); font-weight: 700; }
.mod-card.folder { border-style: dashed; }
.mod-card.folder .name::before { content: "▸ "; color: var(--accent); }
@media (max-width: 480px) {
  .feature { grid-template-columns: 1fr; gap: 0; }
  dl.file { grid-template-columns: 1fr; }
  dl.file dd { margin-bottom: 6px; }
}
@media (prefers-reduced-motion: no-preference) {
  .step { animation: rise 0.18s ease-out; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}
</style>

<div class="wrap">

    <h1>MODライブラリ</h1>

  {
    id: "ponderererer",
    name: "Ponderererer",
    summary: "Ponder（思案画面）に、レーザー・稲妻・爆発・ゲージ・機械の画面・プレイヤーなどの描画を追加するライブラリMODです。思案画面を作るMODから使います。",
    features: [
      ["レーザー・稲妻", "2点の間に光るレーザーや、バチバチした電気の線を出せます。レーザーは撃ち出す動きや、端を動かすこともできます。"],
      ["爆発", "パーティクル・白い光・音を出し、まわりのブロックを消すこともできます。"],
      ["ゲージ", "ブロックの横に、エネルギーや液体の量のバーを表示します。量が増えたり減ったりする動きも付けられます。"],
      ["機械の画面", "スロット・進み具合の矢印・バーがある、機械の画面のような表示を出せます。カーソルでスロットをクリックする動きも見せられます。"],
      ["プレイヤー", "歩く・しゃがむ・飛ぶ・エリトラ・腕を振る・アイテムを使う、の動きができるプレイヤーを出せます。防具も着られるので、MODの防具もゲームと同じ見た目で表示されます。"],
      ["画面の色・音", "画面を暗くしたり、一瞬白く光らせたりできます。音は一度だけ鳴らし、思案画面を早送りしたときは鳴りません。"]
    ],
    notes: [
      "前提MODとして Ponder が必要です（Mekanism: Ponders などに同梱されているものでも動きます）。",
      "クライアント専用です。サーバーには入れなくても大丈夫です。",
      "config/ponderererer-client.toml の demoScenes を true にして再起動すると、避雷針で見本の思案画面を見られます。",
      "v1.2.0 で、ケーブルのつながりや機械の面の見た目が思案画面に反映されるようにしました（1.1.0 の FX.connectTransmitters は、この版から見た目に出ます）。機械の面の入出力の見た目を変える FX.setSideConfig を追加しました。",
      "v1.1.1 で、見本の思案画面の文字が「ponderererer.ponder.…」のまま表示される不具合、画面を暗くする演出で思案画面のボタンが隠れる不具合、エリトラで滑空するプレイヤーの体が立ったままになる不具合を直しました。機械の画面の表示は、場所を決めないときは画面の真ん中に出るようにしました。",
      "v1.1.0 で、思案画面の中で Mekanism のケーブル・パイプ・チューブが、となりのケーブルや機械とつながって表示されるようにする機能（FX.connectTransmitters）を追加しました。",
      "v1.0.2 で、爆発で床のブロックやバリアが消えてしまう不具合と、プレイヤーに装備を着せたときに音が鳴ることがある不具合を直しました。",
      "v1.0.1 で、demoScenes を true にしても避雷針に見本の思案画面が出ない不具合と、見本の中でブロックが置かれない不具合を直しました。",
      "v1.0.0 は最初の版です。まだゲーム内での動作確認はしていません。"

  {
    id: "recipecraft",
    name: "RecipeCraft",
    summary: "ゲームの中でレシピをGUIで作り変えられるMOD。データパックやJSONを書かずに、作業台に材料を置く感覚でレシピを編集・追加・削除できます。",
    features: [
      ["レシピ編集", "K キーでエディタを開きます。インベントリでアイテムにカーソルを合わせて K を押すと、そのアイテムのレシピを直接開けます。レシピの追加・削除もでき、「元に戻す」でいつでも元のレシピに戻せます。"],
      ["対応レシピ", "作業台（形あり・形なし）、かまど・溶鉱炉・燻製器・焚き火、石切台、鍛冶台（変換・装飾）、金床（このMOD独自。経験値コストや必要数も設定可）。そのほかのレシピは JSON モードで編集できます。"],
      ["ほかのMOD", "v0.2.0 から。Mekanism・Create・AE2・Farmer's Delight・Immersive Engineering・Botania・Thermal のレシピも、作業台に置く感覚で編集できます（入っているMODの分だけ選べます）。Create は副産物・確率・必要な熱、IE はエネルギー、Botania はマナも設定できます。"],
      ["タグ指定", "「鉄インゴットならどれでも可」のように、材料をタグで指定できます。"],
      ["マルチプレイ", "編集できるのは OP（権限レベル2）だけ。保存したレシピはサーバーの全員にすぐ反映されます。「一旦保存」でまとめて編集し、あとで一気に反映することもできます。"],
      ["JEI・EMI", "変更したレシピだけを差し替えるので、MODが多くても重くなりにくい作りです。"],
      ["バックアップ", "編集内容を番号付きでいくつでも保存・復元できます。ファイルやコードに書き出して、別のワールドや友だちに渡せます。"]
    ],
    notes: [
      "サーバーとクライアントの両方に入れてください。",
      "染色など、JSONを持たない特殊なレシピは編集できません。",
      "編集したレシピはワールドごとに保存されます。",
      "v0.2.0 の主な変更: 他MODのレシピ（Mekanism の濃縮室、Create のメカニカルクラフトなど37種類）に対応。「一旦保存」で元に戻したレシピが「保存して反映」で反映されない不具合を修正。バックアップに削除したレシピと反映待ちのレシピも入るようになり、読み込んだ内容は「反映する」を押すまで反映待ちになります。",
      "Thermal のレシピは 1.20.1 版だけで使えます（Thermal に 1.21.1 版がないため）。",
      "v0.2.1 で、/reload のあとなどに改変したレシピが元に戻ることがある不具合と、Mekanism・Create・IE の機械が改変前のレシピを使い続ける不具合を直しました。",
      "v0.2.2 で、ワールドを開いたときに、ほかのMOD（KubeJS など）の起動処理で改変したレシピが元に戻ることがある問題に対策しました。戻っていたら自動で当て直します。"
    ],
    install: [
      "{loader} {loaderVersion} を Minecraft {mc} に入れます。",
      "ダウンロードしたZIPを展開し、中の <code>{jar}</code> を取り出します。",
      "jar を <code>.minecraft/mods</code> フォルダに入れます。",
      "マルチプレイで使う場合は、サーバーの <code>mods</code> フォルダにも同じ jar を入れます（両方に必要です）。",
      "ゲームを起動し、OP権限のある状態で <code>K</code> を押すとレシピエディタが開きます。左の一覧からアイテムを選び、材料と完成品を置いて「保存して反映」を押せば完了です。"
    ],

      ["まとめて編集", "Ctrl／Shift＋クリックで複数のアイテムを選び、同じ値を一度に設定できます。"],
      ["反映", "ProjectE の仕様で、変更は /reload で反映されます。「変更を反映」ボタンで送れるほか、変更のたびに自動で反映する設定もあります。"]

      "v1.1.0 で NeoForge 1.20.4 と 1.21.1 に対応しました（ProjectE の NeoForge 版がこの2つにあるため）。1.21.1 版は NeoForge 21.1.x、1.20.4 版は 20.4.x ならどの版でも動きます。NeoForge 版では「自動で反映」がチェックボックスではなくオン／オフのボタンになっています。",
      "EMC を変更するには OP 権限（レベル2）が必要です。権限がないとボタンが押せず、警告が出ます。シングルプレイではチートをオンにしてください。",

  {
    id: "mentionmod",
    name: "Mention Mod",
    summary: "チャットで @プレイヤー名・@OP・@everyone のメンションと、メッセージへの返信ができるMOD。メンションは色付きで表示され、ゲームを見ていないときは Windows の通知が届きます。",
    features: [
      ["@プレイヤー名", "オンラインのプレイヤーをメンションします。大文字・小文字はどちらでも構いません。名前は水色で表示されます。"],
      ["@OP", "オンラインの OP 全員をメンションします。金色で表示されます。"],
      ["@everyone", "オンラインの全員をメンションします。使えるのは OP（権限レベル2以上）だけで、OP 以外が使うと本人にだけお知らせが出ます。"],
      ["返信", "v1.1.0 から。チャット画面でメッセージを右クリックすると返信モードになり、入力欄の上に返信先が出ます。そのまま送ると「↪名前「元のメッセージ」」が付き、相手に通知が届きます。もう一度右クリックするか Esc で解除できます。"],
      ["Watut 連携", "v1.2.0 から。What Are They Up To（Watut）が入っていると、チャット画面の「〇〇 is typing」が「〇〇が入力中」になり、返信モードで打っている人は「〇〇が返信中」と表示されます。"],
      ["@ai", "v1.4.0 から（v1.5.0 から @ai。@gemini でも使えます）。Call AI（v1.4.0 以降）と一緒にサーバーに入れると、チャットで @ai と書いて話しかけた内容に、Gemini がチャットで返事をします。考えている間は全員の画面に「Geminiが考え中」「Geminiが返信中」と出ます。"],
      ["AI の状態", "v1.3.0 から。Call AI（v1.3.0 以降）と一緒に入れると、/tell @gemini でささやいた人のチャット画面に「Geminiが考え中」「Geminiが返信中」と出ます。Watut が無くても出ます。"],
      ["通知の音", "v1.4.0 から。メンションや返信をされると、ゲーム内でも「ポーン」と音が鳴ります。"],
      ["Windows 通知", "メンションや返信をされたとき、Minecraft が最前面にない（最小化中や別の画面を見ている）ときだけ、送り主「Minecraft」の通知が届き、タスクバーのアイコンが点滅します。"]

      "サーバーとクライアントの両方に入れてください。このMODが入っていないプレイヤーもサーバーには入れます（色付き表示だけが見え、通知は届きません）。",

      "返信は、メッセージの本文（名前以外の部分）を右クリックしてください。サーバーにこのMODが入っていない場合は、返信の代わりに「@名前」が付いて送られます。",
      "Watut 連携は Watut が入っているときだけ動きます。Watut の設定で入力中の表示をオフにしていると表示されません。「返信中」を出すには、サーバーにもこのMODが必要です。",
      "v1.4.1 で、Gemini が長く考えているときに「考え中」の表示が途中で消えないようにしました。",
      "v1.4.0 で、チャットの @gemini への返事と、ゲーム内の通知音を追加しました。@gemini への返事は、Call AI v1.7.0 から 1.21.1 NeoForge 版もあるので、どちらのバージョンでも使えます。会話の記憶は /tell @gemini と共通です。",
      "v1.3.0 で Call AI との連携を追加しました。AI の状態はささやいた本人にだけ表示されます。サーバーとクライアントで版をそろえてください。",

  {
    id: "geminitell",
    name: "Call AI",
    summary: "/tell @ai でささやくと、AI（Google の Gemini か、OpenAI・Ollama・LM Studio などの OpenAI互換API）がささやき返してくれるMOD。頼めばコマンドも実行してくれます。サーバーのOPがAPIキーを設定すれば、参加者の誰でも Gemini と話せます。",
    features: [
      ["クールダウン", "v2.4.0 から。AIに話しかけられる間隔を、話しかけ方ごと・プレイヤーごとに決められます。/tell @ai（初期値10秒）はクールダウン中だと「クールダウン中です。」とささやき返し、チャットの @ai（初期値5秒）とコンソール・コマンドブロックからの呼びかけ（初期値0秒）はクールダウン中だと何も返しません。/ai cooldown で確認、OP は /ai cooldown <tell|chat|console> <秒> で変えられます。"],
      ["ゲームの様子を見る", "v2.3.0 から。話しかけた人のディメンション・座標・体力・空腹度・経験値レベル・ゲームモード・権限レベル・エフェクトと、時間・天気・オンラインのプレイヤー・使えるコマンドの一覧をAIが見て答えます（例: /tell @ai 今何時？、/tell @ai 体力どれくらい？）。進捗や死亡への反応でも使います。"],
      ["物を覚える", "v2.2.0 から。「覚えて」と頼んだことや、名前・好きなもの・拠点の座標などをAIが覚えて、ログアウトやサーバーの再起動のあとも思い出します。覚えた時は「📝 AIが覚えました」と出ます。/ai memory で覚えていることの一覧、/ai memory add <内容> で自分で覚えさせる、/ai memory remove <番号> と /ai memory clear で忘れさせられます。サーバーのみんなに関係することは /ai memory server で見られます（変えるのは OP）。"],
      ["OpenAI互換API", "v2.0.0 から。Gemini のほかに、OpenAI互換のAPI（OpenAI・Ollama・LM Studio・llama.cpp など）にもつなげます。OP が /ai provider openai でつなぐ先を切り替え、/ai openai url <URL>（例: http://192.168.0.10:11434/v1）でURL、/ai model <名前> でモデル、キーが要るサーバーなら /ai openai key <キー> を設定します。/ai provider gemini で Gemini に戻せます。自分のPCやスマホで動かしているAIなら無料で使えます。"],
      ["できごとに反応", "v2.1.0 から。プレイヤーが進捗（挑戦など）を達成した時はAIが褒めたり煽ったり、死んだ時は煽ったり慰めたりして、チャットでひとこと喋ります。/ai react で今の設定を確認、/ai react me false で自分には反応しないようにできます。OP は /ai react advancement <off|praise|tease|mixed>、/ai react advancement scope <challenge|goal|task>（反応する進捗の種類）、/ai react death <off|tease|comfort|mixed>、/ai react output <chat|whisper>、/ai react chance <0〜100>、/ai react cooldown <秒> で変えられます。"],
      ["AIの名前", "v2.0.0 から。OP が /ai name <名前> で、ささやきやチャットに出るAIの名前を変えられます（初期値は AI）。"],
      ["ささやく", "/tell @ai <メッセージ> で話しかけると、Gemini からささやきで返事が届きます。/msg と /w でも使えます。"],
      ["@ai", "v1.1.0 から、@ai が正式なセレクターになりました。入力中に赤くならず、Tab で候補に出ます（OP でなくても出ます）。v1.4.0 からは /tell・/msg・/w の宛先にだけ候補が出て、/kill などには出なくなりました。"],
      ["会話の記憶", "プレイヤーごとに直近10往復の会話を覚えています。/ai reset で自分の会話を消せます。ログアウトすると消えます。"],
      ["画面の読み取り", "v1.6.0 から。/ai read true にすると、Gemini に話しかけたときに、そのときのあなたの画面のスクリーンショットも Gemini に送られ、画面を見て答えてくれます。/ai read false でオフ、/ai read で今の設定を確認できます。初期値はオフです。"],
      ["キーの使い分け", "v1.7.0 から。/ai key set <APIキー> で自分のキーを設定します（最後に何も付けないか public なら、ほかの人も借りられます。private なら自分だけ）。/ai key list で借りられるキーの一覧、/ai key use <名前> でその人のキーを借りて話せます（/ai key use だけでやめる）。使う順番は「借りているキー → 自分のキー → デフォルトのキー」です。"],
      ["OP用コマンド", "/ai default_key set <APIキー> で、自分でキーを設定していない人が使うデフォルトのキーを設定、/ai default_key clear で削除、/ai model <名前> でモデルを変更できます。/ai status は誰でも使えます（キーは伏せ字で表示）。"],
      ["Mention Mod 連携", "v1.3.0 から。Mention Mod（v1.3.0 以降）も入っていると、Gemini に問い合わせている間は「Geminiが考え中」、返事が届く直前は「Geminiが返信中」と、ささやいた人のチャット画面に出ます。"],
      ["チャットで話しかける", "v1.4.0 から。Mention Mod（v1.4.0 以降）もサーバーに入っていると、チャットで @ai と書いて話しかけた内容に、Gemini がチャットで全員に見える返事をします。"],
      ["コマンドの実行", "v1.9.0 から。/ai do <やってほしいこと>（例: /ai do 朝にして）で、Gemini が必要なコマンドを考えて実行し、何をしたかをささやきで教えてくれます。/tell @ai やチャットの @ai で頼んでもOKです。実行したコマンドはあなたの画面に表示されます。権限は話しかけた人の権限までなので、OP でない人が Gemini に OP 用のコマンドを実行させることはできません。"],
      ["コマンドの設定", "v1.9.0 から。/ai commands で今の設定を確認できます。OP は /ai commands mode <all|do|off> で実行できる場面（all＝どこでも、do＝/ai do のときだけ、off＝実行しない）、/ai commands level <0〜4> で権限の上限（初期値 2）、/ai commands block <名前> と unblock <名前> で実行させないコマンドを変えられます。/stop・/op・/ban などは初めから禁止されています。"],
      ["考える時間", "v1.8.0 から。/ai thinking <default|minimal|low|medium|high> で Gemini が返事の前に考える量を変えられます（初期値は low で速めに返事が来ます）。/ai timeout <秒> で返事を待つ最大秒数を 5〜600 秒にできます（初期値 120 秒）。どちらも OP 用です。"],
      ["設定", "ワールドの serverconfig/callai-server.toml（v1.1.0 は geminitell-server.toml）で、表示名・Geminiへの指示・覚える往復数・クールダウン・返事の最大文字数などを変えられます。"]
    ],
    notes: [
      "v2.4.0 で、話しかけ方ごとのクールダウンを追加しました。前の版の cooldownSeconds（初期値3秒）は使わなくなり、/tell @ai は10秒、チャットの @ai は5秒が初期値になります。コンソール・コマンドブロック・ファンクションから /tell @ai すると、デフォルトのキーで聞いて、返事をチャットで全員に見せるようにしました（今まではプレイヤー以外は使えませんでした）。",
      "v2.3.0 で、AIがゲームの様子（ディメンション・プレイヤー・時間・体力・空腹度・権限レベル・レベル・エフェクト・使えるコマンド）を見られるようにしました。あわせて、OpenAI互換APIで考えている途中の文がチャットに出ることがあったのと、OP がコンソールから /ai memory server add を使えなかったのを直しました。死んだ時の反応は、ほかのMODが死亡を取り消した時（トーテムのような効果など）には出ないようにしました。",
      "v2.2.1 で、小さいモデルが返事に [覚えて: nothing] のような目印をそのまま書いてしまうのを直しました（中身が無い目印は覚えず、チャットにも出しません）。覚えていることを聞かれた時に答えやすくしました。OP が /ai memory auto false にすると、AIが自分から覚えるのをやめられます（/ai memory add で覚えさせたことは思い出します）。",
      "v2.2.0 で、AIが物を覚えられるようにしました（ワールドの serverconfig/callai-memory.json に保存。1人30個、サーバー全体で50個まで）。進捗への反応は、初期設定ですべての進捗に反応するようにしました（前の版の設定は使わず、新しい初期値になります）。Mention Mod v1.5.0 と一緒に入れると、チャットでは @ai で話しかけられます。",
      "v2.1.1 で、OpenAI互換APIの返事の形がちがうサーバー（スマホのAIアプリなど）で「返事が空でした」になっていたのを直しました。それでも空のときは、サーバーの返事の中身をエラーに表示します。",
      "v2.1.0 で、進捗の達成や死亡にAIが反応するようにしました。初期設定では「目標」と「挑戦」の進捗と死亡に、チャットで全員に見えるように反応します。反応するたびにAPIを1回使うので、同じ人には10秒に1回までにしています（/ai react cooldown で変えられます）。煽るときも、ひどい悪口は言わないように指示しています。",
      "Gemini API のキー（Google AI Studio で作れます）が必要です。API の利用料金はキーの持ち主にかかります。",
      "サーバーには必須です。クライアントは入れなくても参加できますが、入れると @gemini が補完されます。",
      "OP用コマンドには権限レベル2以上が必要です。",
      "モデルの初期設定は gemini-flash-latest（いつも最新の Flash を使う指定）です。",
      "/kill @gemini のように、ほかのコマンドで @gemini を使っても誰にも当たりません。",
      "v1.9.0 で、Gemini がコマンドを実行できるようにしました。1回の話しかけで実行できるのは初期設定で8個までです（設定ファイルの maxCommandsPerMessage で変えられます）。Gemini が実行したコマンドはサーバーのログにも残ります。Forge 1.20.1 版の MOD 一覧で説明文が文字化けしていたのも直しました。",
      "v1.8.0 で、考える時間が長いモデルで時間切れになりにくくしました。返事を待つ時間の初期値を30秒から120秒にし、考える量（thinking）を設定できるようにしました。考える量に対応していないモデルでは自動で指定なしに戻ります。待ち時間の設定は新しい名前（replyTimeoutSeconds）になったので、前に timeoutSeconds を変えていた人はもう一度設定してください。",
      "v1.7.0 から NeoForge 1.21.1 版もあります。中身は Forge 1.20.1 版と同じです。Mention Mod（v1.4.0 以降）の 1.21.1 版と一緒に入れると、1.21.1 でもチャットの @gemini で話しかけられます。",
      "v1.7.0 でキーの仕組みを変えました。今までの「みんなで使うキー」は「デフォルトのキー」になり、/gemini default_key set で設定します（今までのキーはそのまま引き継がれます）。/gemini key set は自分のキーの設定になりました。v1.5.0 の自分だけのキーは private として引き継がれます。借りた人はキーの中身を見られませんが、使った分はキーの持ち主の使用量になります。",
      "v1.6.0 で画面の読み取り（/gemini read）を追加しました。設定はプレイヤーごとです。使うにはクライアントにも Call AI が必要です。スクリーンショットはファイルに保存されず、Gemini に送るときだけ撮られます。画像を送る分、API の使用量は少し増えます。",
      "v1.5.0 で自分だけのAPIキー（private）を追加しました。/gemini key set の最後に何も付けないと、今までどおりみんなで使うキー（public）になります。自分だけのキーはワールドの serverconfig/callai-private-keys.json に保存されるので、サーバーの管理者には見えます。/gemini status は誰でも使えるようになりました（みんなのキーの中身はOPにだけ伏せ字で表示）。",
      "v1.4.0 で、@gemini の候補を /tell・/msg・/w だけに出すようにし、Mention Mod からチャットで話しかけられるようにしました。",
      "v1.3.0 で Mention Mod との連携を追加しました。Mention Mod が入っているときは、返事を届ける前に「返信中」を少し（1〜4秒）表示します。Mention Mod が無ければ今までどおりすぐ届きます。",
      "v1.2.0 でMODの名前を「Gemini Tell」から「Call AI」に変えました（MOD ID も callai に変わりました）。機能は v1.1.0 と同じです。v1.1.0 から更新するときは古い jar を消してください。設定ファイルが新しくなるので、もう一度 /gemini key set でAPIキーを設定してください。"
    ],
    install: [
      "{loader} {loaderVersion} を Minecraft {mc} に入れます。",
      "ダウンロードしたZIPを展開し、中の <code>{jar}</code> を取り出します。",
      "jar をサーバーの <code>mods</code> フォルダに入れます。補完を使いたい人は <code>.minecraft/mods</code> にも入れます。",
      "サーバーを起動し、OP が <code>/ai default_key set &lt;APIキー&gt;</code> を実行します（OpenAI互換APIを使うときは <code>/ai provider openai</code>・<code>/ai openai url &lt;URL&gt;</code>・<code>/ai model &lt;名前&gt;</code>）。",
      "<code>/tell @ai こんにちは</code> と送ると、Gemini から返事が届きます。コマンドを頼むときは <code>/ai do 朝にして</code> のように送ります。"

      ["起動時に確認", "起動すると裏で更新情報を確認し、新しい版があればタイトル画面に一覧が出ます。入っているMODのうち、使っている Minecraft とローダーに合う版だけが対象です。"],
      ["選んで更新", "更新するMODを選んで「選んだMODを更新」を押すとダウンロードします。「今回は更新しない」も選べます。カーソルを合わせると変更内容が出ます。"],
      ["二度と表示しない", "v1.1.0 から。押すと、そのとき一覧に出ていたMODの更新は起動時に二度と出なくなります。あとから新しく入れたMODに更新があるときは、そのMODだけが表示されます。"],
      ["安全な入れ替え", "ダウンロードしたファイルは SHA-256 で壊れていないか確かめます。入れ替えはゲームを終了したあとに行われ、次の起動から新しい版になります（起動中のjarは置き換えられないため）。"],
      ["更新ボタン", "v1.1.0 から。タイトル画面の言語ボタンの左に、矢印のアイコンの更新ボタンが出ます。押すとその場で確認し直せます（「二度と表示しない」にしたMODも出ます）。更新があるときはアイコンに緑の印が付きます。MOD一覧の「設定」ボタンからも開けます。"],
      ["サーバー", "専用サーバーでは確認画面なしで自動でダウンロードし、サーバーを停止したあとに入れ替えます（設定で止められます）。"],
      ["Ctrl+U で開く", "v1.3.0 から。タイトル画面などのメニューで Ctrl+U を押すと、更新の確認画面が開きます（ほかのMODでボタンが隠れたり重なったりしても使えます）。キーは操作設定の「MODの更新を確認」で変えられます。"],
      ["必要なMODの案内", "v1.4.0 から。ダウンロードしたMODにほかのMODが必要なとき（Hyperlink Ponder の Hyperlink-E・Ponder など）、まだ入っていなければ教えてくれます。MODライブラリにあるMODは選んで一緒にダウンロードでき、ないMODは名前をコピーしたり、Modrinth の検索ページを開いたりできます。v1.4.1 から、CurseForge アプリか Modrinth App で起動しているときは、ライブラリにないMODがそのサイトにあるかどうかも一文で出て、「開く」でそのサイトのページが開きます。"],
      ["MODを追加", "v1.5.0 から。更新ボタンの上の「＋」のボタンを押すと、まだ入れていないMODをMODライブラリから選んで追加できます。"],
      ["ワールドの中から", "v1.5.0 から。ワールドで遊んでいる間も Ctrl+U で更新の確認画面が開きます。ポーズ画面（Esc）の「ゲームに戻る」の左にも、更新ボタンと「MODを追加」ボタンが出ます。"],
      ["自分も更新", "このMOD自身の新しい版も同じように入れ替わります。"]
    ],
    notes: [
      "更新情報とjarは公開リポジトリ EeeeeeruKi/EC-mod から取得します。インターネットにつながっている必要があります。",
      "対象は mods フォルダに直接入っている jar だけです。ほかのMOD（Modrinth などで配られているもの）は触りません。",
      "設定は config/claudeupdater.json です。起動時の確認のオン／オフ、サーバーでの自動更新、起動時に表示しないMOD（hidden）を変えられます。",
      "v1.1.0 で「選んだ版は今後お知らせしない」を「二度と表示しない」に変えました。v1.0.0 でお知らせしないにしたMODは、そのまま「二度と表示しない」に引き継がれます。また表示したいときは、更新ボタンから開いて「起動時にまた表示する」を押してください。",
      "v1.6.0 で、ダウンロードのあとのボタンを「ゲームを終了して入れ替える」から「適用して再起動」に変えました。押すとゲームが一度閉じ、新しい版に入れ替えたあとで自動でもう一度起動します（Prism Launcher・MultiMC と、起動のしかたが分かるランチャーで使えます。分からないときは、今までどおり閉じるだけになります）。",
      "v1.5.0 で、タイトル画面の更新ボタンの上に「MODを追加」ボタンを付け、ワールドの中（遊んでいる間とポーズ画面）からも開けるようにしました。ワールドの中でダウンロードしたときは、ワールドから出てゲームを終了すると入れ替わります（ワールドの中からはゲームを終了するボタンは出ません）。",
      "v1.4.1 で、CurseForge アプリか Modrinth App で起動しているのがはっきりわかるときだけ、ライブラリにない必要なMODがそのサイトにあるかを調べるようにしました（Prism や公式ランチャーでは今までどおり Modrinth の検索ページを開きます）。Modrinth は公式の API、CurseForge は公開されている CFWidget を使って調べます。CurseForge はMODの名前から探すので、名前が違うと見つからないことがあります。",
      "v1.4.0 で、一度ダウンロードしたMODが、更新画面を開き直すとまたダウンロードできてしまう不具合を直しました。ダウンロード済みのMODは、ゲームを終了して入れ替わるまで一覧に出ません。また、1.0 と 1.0.0 のように書き方だけ違う版を新しい版と間違えないようにし、サーバーでも「二度と表示しない」にしたMODは自動で更新しないようにしました。",
      "必要なMODは、ダウンロードしたjarの中の情報（mods.toml・fabric.mod.json）から読み取ります。必要なMODが入っているかどうかだけを見て、版が古いかどうかは確かめません。",
      "v1.3.0 から Fabric 1.21.1 版もあります（Fabric API が必要です）。中身は NeoForge 版と同じです。Fabric 版では、Ctrl+U の Ctrl は変えられません（キー設定で変えられるのは U の部分だけです）。新しいMODを入れる画面は Ctrl+Shift+U です。設定ボタンは Mod Menu が入っているときに MOD 一覧から使えます。",
      "v1.3.0 で、メニューで Ctrl+U を押すと更新の確認画面が開くようにしました。ワールドに入っている間は反応しません。",
      "v1.2.2 で、ゲームのフォルダ名に日本語などが入っていると、終了後の入れ替えが失敗することがある不具合を直しました。",
      "v1.2.1 で、ゲームを終了したあとにMODが入れ替わらないことがある不具合を直しました。v1.2.0 以前から更新するときは、このMODだけ一度手で入れ替えてください。",
      "入れ替えの記録は claudeupdater/apply.log に残ります。",
      "クライアントとサーバーの片方だけに入れても問題ありません。"
    ],
    install: [
      "{loader} {loaderVersion} を Minecraft {mc} に入れます。",
      "ダウンロードしたZIPを展開し、中の <code>{jar}</code> を取り出します。",
      "jar を <code>.minecraft/mods</code> フォルダに入れます。サーバーも自動で更新したい場合は、サーバーの <code>mods</code> にも入れます。",
      "ゲームを起動すると、新しい版があるときだけタイトル画面に更新の画面が出ます。"
    ],

  {
    id: "tonsofadv",
    name: "Tons of Advancements（進捗どっさり）",
    summary: "進捗を1700個以上追加するMOD。アイテム集め・モブ討伐・探検・やり込み・ネタ系の進捗がどっさり入っていて、達成すると経験値がもらえます。v1.4.0 から、人気のMOD100個（Create・Mekanism・AE2・黄昏の森など）の進捗も追加されます。データパック版もあります。",
    features: [
      ["ちょっとした行動", "v1.8.0 から。歩いた・走った・しゃがんだ・ジャンプした・チェストを開けたなど「はじめての○○」の進捗と、MOD版では、右を向いた・左を向いた・上を見た・下を見た・真上を見た・後ろに歩いた・カニ歩き・キョロキョロ・うなずいた・一回転などの進捗が「ちょっとした行動」タブに入っています。"],
      ["26.2 対応", "v1.7.0 から Minecraft 26.2 の NeoForge 版と Fabric 版があります（Fabric 版は Fabric API が必要です）。26.2 版には、26.2 に対応しているMOD 29 個（Mekanism・Biomes O' Plenty・SecurityCraft・Occultism・Ender IO・Sophisticated Backpacks など）の進捗が入っています。"],
      ["ほぼ全部の行動", "v1.6.0 から。全部のブロックを置く・掘る、作れるアイテムを全部作る、全部の効果を受ける・ポーションを醸造する・エンチャントを集める、釣り・取引・乗り物・攻撃を受けた相手・斧で皮をはぐなどの体験、全部のモブ・MODのモブの討伐数、全部の道具の使いつぶしの進捗があります。MOD版では、チャット・コマンド・クリティカル・作物の収穫・原木・鉱石・経験値オーブなどの回数も数えます。"],
      ["音の設定", "v1.6.0 から。エーテルなどの特別な進捗の音を鳴らすかどうかを設定できます（初めはオン）。MOD一覧でこのMODを選んで「設定」から変えられます。"],
      ["何かをした回数", "v1.5.0 から。クラフトした回数・製錬した数・置いた／壊したブロックの数・集めた経験値・最高レベル・食べた回数・ポーション・弓・手なずけた数・達成した進捗の数（MOD版だけ）、アイテムごとの作った数・使った回数・使いつぶした回数、やられた相手、死なずに過ごした日数などの進捗があります。新しいタブ「クラフト・製錬」「使いこみ」「やられ図鑑」に入っています。"],
      ["MODの回数", "v1.5.0 から。Iron's Spells は唱えた呪文の数・スクロールを使った数・学派ごとの数、Ars Nouveau は唱えた呪文の数、AE2 はMEネットワークにしまった量（1k〜16Mバイト・アイテム数・種類数）で進捗がもらえます。"],
      ["MOD連携", "v1.4.0 から人気のMOD100個に対応しました（v1.1.0 は14個）。入っているMODのアイテム入手・モブ討伐（ボスは挑戦）・バイオーム・ディメンションの進捗が、MODごとのタブに追加されます。1.20.1 版は86個、1.21.1 版は89個のMODに対応しています（MODによってはどちらかの版しかないため）。"],
      ["エーテルの音", "v1.2.0 から。エーテルが入っていると、エーテルのタブの進捗のトーストが出たときに、エーテルの進捗の音が鳴ります（v1.3.0 からトーストの表示に合わせて鳴ります）。v1.8.1 から、エーテルの進捗の音（エーテル本体の進捗も、このMODのエーテルのタブの進捗も）は「ジュークボックス/音ブロック」の音量で大きさを変えられます。ダンジョンのボス（スライダー・ヴァルキリークイーン・太陽の精霊）は、エーテルと同じく銅・銀・金の音です。"],
      ["集める", "ほぼすべてのアイテム・ブロック（約1100種類）に「手に入れる」進捗があります。木材・石材・カラフル・鉱石・装備・レッドストーン・自然・食べ物・いろいろのタブに分かれています。"],
      ["倒す", "すべてのモブの討伐に加えて、主なモブを10体・100体・1000体倒すやり込み進捗があります。"],
      ["探検", "すべてのバイオーム・構造物・ディメンションに行く進捗と、Y-60より下・Y300より上・原点から1万ブロックなどの進捗があります。"],
      ["やり込み", "歩いた距離・ジャンプ回数・遊んだ時間・釣った魚・取引回数などの統計と、ブロックの採掘数に段階つきの進捗があります。"],
      ["グルメ・動物", "すべての食べ物を食べる、動物を繁殖させる・手なずける進捗があります。"],
      ["ネタ", "かぼちゃ頭、成金（金の防具を全身）、はじめての死、ダイヤの山など、ちょっと変わった進捗も入っています。"],
      ["報酬", "達成すると経験値がもらえます（ふつう5、目標20、挑戦50。やり込みは段階が上がるほど多くもらえます）。"]
    ],
    notes: [
      "進捗のタブは「どっさり：○○」という名前で、全部で約20個あります。",
      "アイテムの名前はゲームの言語設定に合わせて表示されます。",
      "1.20.1 版は1734個、1.21.1 版は1818個です（1.21.1 で増えたアイテムやモブの分が多くなっています）。",
      "v1.1.0 で、MOD連携の進捗を追加しました（1.20.1 版で約5200個、1.21.1 版で約5700個）。入っていないMODの進捗は読み込まれないので、全部そろえなくても大丈夫です。進捗の数が多いので、MODをたくさん入れているとタブが多くなります。",
      "MOD連携の進捗は、それぞれのMODの公開されているソースからアイテムを集めて作っています。MODの版によっては一部の進捗が読み込まれず、ログに出ることがあります（ゲームには影響しません）。",
      "v1.4.0 で、MOD連携を人気のMOD100個に広げました（MOD連携の進捗は合計約14000個）。人気の順番は Modrinth・CurseForge のダウンロード数をもとにした目安で、ライブラリや軽量化MODのようにアイテムを追加しないMODは入れていません。ChippedやRechiseledのようにブロックの種類がとても多いMODは、400個まで間引いています。進捗の数が多いので、MODをたくさん入れていると読み込みが少し長くなることがあります。",
      "対応MOD（人気順）: Create、Farmer's Delight、Supplementaries、Quark、Alex's Mobs、Sophisticated Backpacks、BiomesOPlenty、Mekanism、Applied Energistics 2、The Twilight Forest、Tinkers' Construct、The Aether、Storage Drawers、Botania、Iron's Spells 'n Spellbooks、Ars Nouveau、Alex's Caves、Immersive Engineering、Ice and Fire、Artifacts、Apotheosis、Sophisticated Storage、TravelersBackpack、Comforts、Aquaculture 2、Chipped、Handcrafted、Deeper and Darker、SecurityCraft、Mystical Agriculture、Functional Storage、Tom's Simple Storage Mod、Ender IO、Industrial Foregoing、Ad Astra、The Undergarden、The Bumblezone、Naturalist、Another Furniture、Friends&Foes、Create Crafts & Additions、Create: Steam 'n' Rails、Pipez、Gravestone Mod、Easy Villagers、Productive Bees、Blood Magic、Occultism、Forbidden & Arcanus、Enigmatic Legacy、Relics、tetra、PneumaticCraft: Repressurized、Draconic Evolution、Extended Crafting、Lootr、Rechiseled、XNet、RFToolsUtility、IntegratedDynamics、EvilCraft、Simply Swords、Epic Fight、amendments、Immersive Armors、Immersive Aircraft、Minecraft Comes Alive、Cyclic、storagenetwork、Snow! Real Magic!、Torchmaster、Building Gadgets 2、Mining Gadgets、Just Dire Things、LaserIO、Flux Networks、CC: Tweaked、advancedperipherals、FramedBlocks、SereneSeasons、ToughAsNails、Iron Furnaces、Hostile Neural Networks、NaturesAura、Actually Additions、exposure、Modern Industrialization、Oritech、Elevator Mod、ProjectE、Silent Gear、Backpacked、Dynamic Trees、BotanyPots、Iron Jetpacks、Mystical Agradditions、EnderStorage、expatternprovider、AE2WTLib、Ars Elemental。",
      "v1.8.5 で、ふつうの進捗もチャットに流すようにしました（タブの一番上と「ちょっとした行動」タブは流しません）。Minecraft 本体に同じ条件の進捗があるもの（ダイヤモンド・鉄インゴット・ネザーへようこそ・すやすや など1.20.1で26個）は、本体のほうを残してこちらを消しました。進捗エディターで書き換えた名前（「歩く鉄」「おしゃれ！」など23個）も入っています。",
      "v1.8.4 で、同じことをすると同時に達成される進捗（「おやすみ」と「すやすや」、「泳いだ」と「クロール」、「あちっ」と「あちちっ」など16個）を1つにまとめました。消えた進捗の続きの進捗は、1つ前の進捗につながります。",
      "v1.8.3 で、ATM9 No Frills に入っているMODのほとんど（Allthemodium・All the Ores・Powah・Thermal・Extreme Reactors・RFTools・MEGA Cells・AdvancedAE・Supplementaries・Cataclysm・Blue Skies・Stargate Journey など56個）の進捗を 1.20.1 版に足しました（1.20.1 版の進捗は約26,000個）。CurseForge にしかないMODのうち、中身を調べられなかったもの（AllTheCompressed・All the Arcanist Gear・All the Wizard Gear・Mob Grinding Utils など）は入っていません。また、全部の版で、基本→上級→エリート→アルティメット、Tier 1→2→3、鉄→ダイヤ→ネザライトのように段階があるアイテムと、アップグレードのアイテムを、進捗の画面で順番に一列に並べました。",
      "v1.8.2 で、1.21.1 版でこのMODのエーテルのタブの進捗にエーテルの音が鳴っていなかったのを直しました（エーテル 1.21.1 の仕組みが 1.20.1 と違っていたため）。Fabric 1.21.1 版もエーテル（Fabric 版）に対応して、エーテルの音とジュークボックスの音量での調節が使えるようになりました。Fabric 版には設定画面がないので、config/tonsofadv-client.properties の specialSounds・soundsAsRecords を false にしてゲームを再起動すると切り替えられます。",
      "v1.8.1 から 1.21.1 の Fabric 版もあります（Fabric API が必要です）。進捗は NeoForge 1.21.1 版と同じで、入っているMODの進捗も追加されます（NeoForge にしかないMODの進捗は出ません）。クリティカル・飛び道具を当てた数・経験値オーブの数と、Iron's Spells・Ars Nouveau・AE2 の回数の進捗は入っていません。",
      "v1.8.1 で、エーテルの進捗の音を「音楽」ではなく「ジュークボックス/音ブロック」の音量で鳴らすようにしました。エーテル本体の進捗の音も変わります。BGMを小さくしても進捗の音は聞こえます。元の「音楽」の音量に戻したいときは、MOD一覧の「設定」か config/tonsofadv-client.toml の soundsAsRecords を false にしてください。この変更は 1.20.1 版と 1.21.1 版だけです（26.2 にはエーテルがないため）。",
      "v1.8.0 で「ちょっとした行動」タブを追加しました。向きや見た方向、後ろ・横に歩いた距離はこのMODが毎ティック数えます（この版を入れてから数え始めます）。「はじめての○○」はゲームの統計を使うので、前から遊んでいるワールドではすぐに達成されることがあります。",
      "v1.7.1 で、MOD連携の進捗のうち、アイテムではなく説明文などを拾ってしまっていたもの（約570個）を取り除きました。これが原因で、同じグループの進捗がいくつか読み込まれないことがありました。",
      "v1.7.0 で 26.2 版（NeoForge・Fabric）を追加しました。Create・AE2・黄昏の森など、まだ 26.2 版が出ていないMODの進捗は 26.2 版には入っていません。26.2 にはエーテルがないので、特別な音の設定もありません。",
      "Fabric 26.2 版では、クリティカル・飛び道具を当てた数・経験値オーブの数の進捗は入っていません。置いたブロック・食べた回数・ポーション・弓の回数は、ゲームの統計から計算します（5秒ごと）。",
      "v1.7.0 で、1.20.1 版で鍛冶型の名前が正しく出ていなかったのを直しました。MODの説明文も柔らかい言い方にしました。",
      "v1.6.0 で、進捗の説明を「〜しよう」のような柔らかい言い方にしました。「○○職人 ×1」のような ×1 の表示もなくしました。統計を見る進捗は、毎ティックではなく1秒ごとに確かめるようにして、重くなりにくくしました（達成が最大1秒遅れることがあります）。",
      "音の設定は config/tonsofadv-client.toml の specialSounds でも変えられます（false でオフ）。",
      "v1.5.0 で「何かをした回数」の進捗を追加しました。合計クラフト回数などバニラの統計にない回数は、このMODが独自の統計として数えます（統計画面の「その他」にも出ます）。数え始めるのはこの版を入れてからです。",
      "AE2 の量は、MEターミナル（無線ターミナルも）を開いている間に2秒ごとに数えて、いちばん多かった量を記録します。バイトはアイテムの数と種類から出した目安で、セルの表示と少しずれることがあります。",
      "v1.5.0 で、v1.4.0 の 1.21.1 版で AE2 と Botania の進捗が抜けていたのを直しました。",
      "データパック版にはMOD連携の進捗は入っていません。",
      "v1.3.0 で、エーテルの音をトーストが画面に出たときに鳴らすようにしました（v1.2.0 は進捗を達成した瞬間に鳴っていたので、トーストが順番待ちのときにずれていました）。エーテルの仕組みを使っているので、エーテルを入れているときはサーバーとクライアントの両方にこのMODを入れてください。",
      "v1.2.0 で、エーテルのタブの進捗にエーテルの音を付けました。音は「音楽」の音量で鳴ります（エーテルの進捗と同じ）。音を鳴らすのはサーバー側なので、サーバーにこのMODとエーテルが入っていれば鳴ります。エーテルのボス討伐の進捗は、普通の挑戦の音と重ならないように「目標」にしました。",
      "サーバーで使う場合はサーバーだけに入れても動きます。クライアントにも入れると、タブの名前などがゲームの言語（日本語・英語）に合わせて表示されます。",
      "MODを入れずに使いたい場合は「その他」→「データパック」から、同じ内容のデータパック版をダウンロードできます。"
    ],
    install: [

      "ダウンロードしたZIPを展開し、中の <code>{jar}</code> を取り出します。",

      "マルチプレイで使う場合は、サーバーの <code>mods</code> フォルダにも同じ jar を入れます。",
      "ゲームを起動して <code>L</code> キー（進捗）を押すと、「どっさり：○○」のタブが並んでいます。"

  {
    id: "compacttoasts",
    name: "Compact Toasts",
    summary: "画面右上のトースト（進捗・レシピ解除などの通知）をコンパクトにするMOD。たくさん出たときは1件ずつ1行にまとめ、同時に表示できる数も 5 から 20 に増えます。",
    features: [
      ["コンパクト表示", "表示中のトーストが4つ以上になると、1件ずつ高さ16ピクセルの1行にまとめます。左の色の線で種類がわかります（進捗は黄色、挑戦は紫、レシピは緑、システムは青）。"],
      ["1行の中身", "進捗はアイコンと名前、レシピは完成品のアイコンと名前（2つ以上なら「ほか○件」）、システムのお知らせはタイトルと1行目を表示します。中身が読み取れないMODのトーストは、縮小してそのまま表示します。"],
      ["MODのトースト", "v1.1.0 から。FTB Quests（クエスト完了・報酬・チャプター完了など、FTB Library のトースト）は、アイコンとクエスト名を1行で表示します（チャプター完了はピンク、ほかは金色の線）。ボタニアの辞典など Patchouli の本の「新しい項目」トーストは、本のアイコンと本の名前を表示します（緑の線）。そのほかのMODでも、タイトルやアイコンを読み取れるトーストは1行で表示します（オレンジの線）。"],
      ["見出し", "v1.2.0 から。コンパクト表示のとき、バニラと同じように、はじめの2秒は「進捗を達成しました！」「クエスト完了！」「新しいレシピを解除しました！」などの見出しを出してから、名前に切り替えます。設定の「見出しの表示」で、有効・進捗以外（初期設定）・無効から選べます。「進捗以外」では、進捗のトーストだけ見出しを出さずに最初から名前を表示します。"],
      ["表示数", "同時に表示できるトーストの数がバニラの5から20になります。画面に入りきらないときは、空くまで順番待ちになります。"],
      ["設定", "MOD一覧の「設定」ボタンから、最大表示数（1〜50）と、コンパクト表示にする数（1〜51）をスライダーで変えられます。「テスト用のトーストを表示」で、その場で見え方を確かめられます。"]
    ],
    notes: [
      "クライアント専用のMODです。サーバーには入れなくて大丈夫です。",
      "設定は config/compacttoasts-client.toml にも保存されます（maxToasts と compactThreshold）。",
      "コンパクト表示にする数を最大表示数より大きくすると、コンパクト表示はオフになります。",
      "トーストの表示を丸ごと差し替えるMOD（ほかのトースト改造MOD）とは、一緒に入れると片方が効かないことがあります。",
      "v1.2.0 で「見出しの表示」の設定を追加しました（config ファイルでは headerMode。ALL＝有効、EXCEPT_ADVANCEMENTS＝進捗以外、NONE＝無効）。見出しはコンパクト表示のときだけ使われます。普通の大きさで出ているトーストはバニラと同じ表示です。",
      "v1.1.0 で、FTB Quests・Patchouli（ボタニアの辞典など）のトーストや、ほかのMODのトーストもアイコンと名前の1行で表示するようにしました。どのMODにも依存していないので、入っていなくても動きます。",
      "Fabric 1.21.1 版もあります（Fabric API が必要です）。中身は NeoForge 版と同じです。設定画面は、Mod Menu が入っていれば MOD 一覧の設定ボタンから、入っていなくてもチャットで /compacttoasts と入力すると開けます。設定は config/compacttoasts.json に保存されます。"
    ],
    install: [
      "{loader} {loaderVersion} を Minecraft {mc} に入れます。",
      "ダウンロードしたZIPを展開し、中の <code>{jar}</code> を取り出します。",
      "jar を <code>.minecraft/mods</code> フォルダに入れます。クライアント専用なので、サーバーには入れなくて大丈夫です。",
      "ゲームを起動すると、トーストが4つ以上出たときにコンパクト表示になります。数を変えるときは、MOD一覧で Compact Toasts を選んで「設定」を押してください。"
    ],

  {
    id: "hyperponder",
    name: "Hyperlink Ponder",
    summary: "Hyperlink と Hyperlink-E のハイパーアイテムとフメツウィザーの使い方を、Ponder の思案画面で見られるようにするMODです。アイテムを持って W キーを長押しすると開きます。",
    features: [
      ["ムテキスター", "ホットバーに入れるとムテキになること、コマンドセレクタに選ばれず、アイテムも盗まれないことを説明します。"],
      ["ノベルカリバー", "左クリックで視線付近のエンティティを全て倒すこと、スニーク中は一体だけ倒すことを説明します。"],
      ["クロニクロック", "始点と終点を右クリックして領域を保護すること、左クリックで解除することを説明します。"],
      ["ピックドクス", "左クリックでの即時採掘と、コンボチェイン・コンボクラスターでのまとめ採掘を説明します。"],
      ["V.R.X.", "右クリックでVRXを開いて対象に与えること、左クリックで解くことを説明します。"],
      ["フメツウィザー", "v1.1.0 から。召喚方法、倒し方、怒った時の挙動、不死性の4つの思案画面を、スポーンエッグなどを持って見られます。"]
    ],
    notes: [

      "v1.1.0 で、フメツウィザーの思案画面を追加しました。説明は Hyperlink-E のソースに合わせているので、本家の Hyperlink とは細かい仕様が違うことがあります。",
      "Hyperlink（本家は 1.20.1 Forge、Hyperlink-E は 1.21.1 NeoForge）と、Ponder が必要です。Ponder は Create とは別のMODで、Create が無くても動きます。",
      "クライアントだけに入れれば動きます。サーバーに入れる必要はありません。",
      "Hyperlink の 1.18.2 版は、Ponder が 1.20.1 以降にしか対応していないため、対象外です。",
      "ゲームの中ではまだ動作を確かめていません。表示がおかしいときは教えてください。"

      ["他MODの効果", "Apotheosis の接辞・宝石・エンチャント、Mekanism のジェットパックとメカスーツ、Create Stuff 'N Additions のジェットパックと外骨格、Advanced AE の量子アーマー、Cold Sweat の防寒・耐熱が重ね着でも効きます。"],
      ["Cosmetic Armor と Corpse", "Cosmetic Armor Reworked で見た目が出ていればそれを表示し、透明にしている部位は重ね着の防具を表示します（重ね着スロットは Cosmetic Armor の設定の影響を受けません）。Corpse の死体にも同じルールで反映します。"]

    notes: [

  {
    id: "minecrafttweak",
    name: "minEcraft twEEk",
    summary: "Quark を前提MODにして、Quark にない小さな改善をたくさん詰め込んでいくためのMODです。機能は最初はすべてオフで、ひとつずつオンにできます。",
    features: [
      ["機能のオン/オフ", "MOD一覧の「設定」から専用の画面を開くと、「調整」「建築」「道具」「整理」「ワールド」「見た目・操作」のタブごとに、機能をひとつずつオン/オフできます。切り替えはすぐに反映されます。"],
      ["詳細設定", "細かい設定がある機能には「詳細」ボタンが付きます。押すと詳細設定の画面が開き、数値は入力欄、オン/オフはボタンで変えられます。カーソルを合わせると説明と入れられる値が出て、「初期値に戻す」で元に戻せます。"],
      ["設定コード", "設定画面の下の欄に設定コードを貼って「インポート」を押すと、まとめて設定できます。設定コードは「項目番号-値」を「,」でつないだもので、たとえば「1-t,1a-2」は「1番の機能をオン、1番の機能の1つ目の詳細設定を 2」という意味です。"],
      ["2つのコード", "「MODのコード」はこのMODと Quark の設定、「描画のコード」はバニラ・Sodium・Sodium Extra の設定です。ボタンを押すと、初期値と違う設定だけがコードになってコピーされるので、短くて済みます。2つのコードは空白で区切って一緒に貼れます。"],
      ["圧縮コード", "「圧縮」をオンにすると、コピーするコードが「MT1.」で始まる短い英数字になります。チャットや Discord の文字数の制限に引っかかりにくくなります（短いコードは圧縮すると逆に長くなるので、そのときはそのままです）。"],
      ["初期化してから読み込む", "「初期化」をオンにしてインポートすると、コードに入っている側（MOD / 描画）の設定を先にすべて初期値に戻してから読み込みます。初期値と違う設定だけのコードを、そのとおりに再現できます。"],
      ["Quark の設定", "Quark のオン/オフと数値の設定を「q」＋6けたの番号で変えられます（例: q123456-f）。番号は設定の場所から計算しているので、Quark のバージョンが変わっても、同じ設定の番号はほぼ変わりません。"],
      ["バニラ・Sodium の設定", "バニラ（v）、Sodium / Embeddium（s）、Sodium Extra / Embeddium Extra（se）の設定も設定コードで変えられます。たとえば「v1-12,v10-f,s2-1」は「描画距離を12、VSyncをオフ、Sodium の葉の品質を描画優先」です。入っていないMODの設定は飛ばされます。設定画面の「ID一覧」で、番号と今の値を確かめられます。"],
      ["コマンド", "「/minecrafttweak list」で番号つきの一覧と今の設定コード（クリックでコピー）、「/minecrafttweak import 1-t,1a-2」でインポートできます（OP権限が必要です）。このMODと Quark の設定を、サーバーで変えるときに使います。"],
      ["システムの言語（最初からオン）", "言語の画面の一覧のいちばん上に「システムの言語」が加わります。選んで「完了」を押すと、パソコンの言語に合わせて言語が切り替わります。パソコンの言語を変えたときは、次に起動したときに合わせ直します。一覧でほかの言語を選ぶと、合わせるのをやめます。"],
      ["カスタムメニューBGM", "タイトル画面などのメニューで、好きな曲を流せます。詳細設定に .ogg・.mp3・.wav のファイルのURL（またはパソコンの中のファイルの場所）を入れるか、「参照」ボタンでパソコンの中のファイルを選んでください。URLの曲は1回ダウンロードしたら保存して、次からはそれを使います。音量とくり返しも選べます。"],
      ["ポーズ画面のBGM", "ポーズ画面を開いているあいだ、タイトル画面と同じ曲を流します。Aether などのMODがタイトル画面の曲を変えていれば、その曲を流します。カスタムメニューBGM がオンなら、その曲を続きから流します。"],
      ["コヨーテタイム", "足場から歩いて落ちたあと、少しのあいだならまだジャンプできます（落ちるたびに1回だけ）。ジャンプできる時間は詳細設定（6a）で 1〜20 ティックから選べます（最初は 5 ティック）。"],
      ["エネルギーキューブを重ねる", "Mekanism の同じティアで同じFEのエネルギーキューブを重ねられます。拾ったときは、持っているキューブとのFEの差が「拾ったときに合わせる範囲」（7b、最初は 10%）以内なら、低いほうに合わせてFEを捨てて重ねます（0 にすると拾ったときは捨てません）。インベントリで手で重ねたときは、50%未満どうし・50%以上どうしなら低いほうに合わせて重ねます（例: 60% と 70% なら 70% を 60% に）。100% のキューブのFEは捨てません。重なっているキューブの充電・放電は、重なっている数だけ遅くなります。重ねられる数（7a）を変えたときは再起動が必要です。"],
      ["チャットの画像", "チャットに画像やGIFを表示します。チャット欄のいちばん左の「＋」ボタンから、画像ファイルか画像のリンクを添付して送れます。リンクの画像は、このmodを入れている人に表示されます。ファイルを送るには、サーバーにもこのmodが入っていて、この機能がオンになっている必要があります。"],
      ["modの安全チェック", "Modgrade（modgrade.com）を使って、mods フォルダのmodにマルウェアなどがないかを調べます。調べるのは、初めて起動したとき・modを足した／更新した／消したとき・前の起動でゲームがクラッシュしたときです。結果はタイトル画面の左上に出て、押すと一覧（問題のあるものから順、Modgrade のページへのリンク付き）が開きます。マルウェアや注意が見つかったときは、一覧が自動で開きます。"],
      ["経験値オーブの素早い吸収", "経験値オーブを1つ吸い込んでから次を吸い込むまでの待ち時間を短くします（バニラは2ティック、詳細設定 1a で 0〜2 を選べます）。"],
      ["英語でも検索", "いまの言語の名前に加えて、英語の名前でもアイテムを探せます。クリエイティブのインベントリ・レシピ本・JEI・EMI・AE2 の端末の検索に対応しています。オン・オフを変えたあとは、ワールドに入り直すと JEI と EMI にも反映されます。"]
    ],
    notes: [
      "Quark（と、Quark の前提MODの Zeta）が必要です。",
      "Quark にある機能は入れません。1.0.0 の「腕付きの防具立て」は Quark にあるので、1.1.0 で外しました。",
      "v1.13.0 で PicPop と連携しました。PicPop も入れていると、「チャットの画像」でチャットに表示された画像をクリックすると、画面の中央に大きく表示されます（マウスを乗せると説明が出ます）。PicPop が無くても、これまでどおり動きます。",
      "v1.9.0 で、設定画面を Quark の Q メニューと同じ並べ方にしました（アイコン付きの分類ボタンが1行に3つ、いちばん下に大きな「完了」）。分類を押すと、その分類の機能の一覧が開きます。設定コードは、ホームの「設定コード」から開けます。また、タイトル画面の言語ボタンの左に、設定を開く小さいボタンを足しました。",
      "v1.8.0 で、「英語でも検索」（5）を追加しました。いまの言語の名前に加えて、英語の名前でもアイテムを検索できます。クリエイティブのインベントリ・レシピ本・JEI・EMI・AE2 の端末の検索に対応しています。",
      "v1.7.2 で、Quark の設定画面（Q メニュー）の分類の並びのいちばん下に「minEcraft twEEk」のボタンを足しました。押すと、このMODの設定画面が開きます。",
      "v1.7.1 で、「システムの言語」を、言語の画面の右上のボタンから、言語の一覧のいちばん上の項目に変えました。機能を有効にするだけで使え、詳細設定（2a）はなくなりました。",
      "機能は最初はオフです（「システムの言語」だけは最初からオン）。使いたい機能をオンにしてください。",
      "カスタムメニューBGM は .ogg・.mp3・.wav に対応しています（YouTube や Spotify などのURLは使えません）。",
      "MP3 を読むために JavaMP3（MIT ライセンス）を使っています。",
      "サーバーとクライアントの両方に入れてください。設定は config/minecrafttweak.toml に保存され、サーバーではサーバー側の設定が使われます。",
      "バニラ・Sodium・Sodium Extra の設定（v / s / se）はクライアントの設定なので、設定画面の欄からインポートします。コマンドでは変えられません。",
      "Quark の設定は、文字や一覧の設定には対応していません（オン/オフと数値だけです）。",
      "「エネルギーキューブを重ねる」は Mekanism が入っているときだけ動きます。サーバーとクライアントで重ねられる数の設定をそろえてください。重なっているキューブも充電・放電できますが、重なっている数だけ遅くなります（全部でちょうどの量になります）。",
      "まだゲームの中では確かめていません。おかしいところがあれば教えてください。"
    ],

const state = { folder: [], mod: null, mc: null, version: null }; // folder: path of open folders
const crumbs = document.getElementById("crumbs");
const stepTitle = document.getElementById("s1");
const modList = document.getElementById("mod-list");
const flow = document.getElementById("flow");

const mcKey = v => v.mc + "|" + v.loader;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const kb = n => (n / 1024).toFixed(0) + " KB";

function cmpVersion(a, b) {
  const pa = a.split(/[.-]/).map(x => parseInt(x, 10) || 0);
  const pb = b.split(/[.-]/).map(x => parseInt(x, 10) || 0);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const d = (pa[i] || 0) - (pb[i] || 0);
    if (d) return d;
  }
  return 0;
}

function mcOptions(mod) {
  const seen = new Map();
  for (const v of mod.versions) if (!seen.has(mcKey(v))) seen.set(mcKey(v), v);
  return [...seen.values()].sort((a, b) => cmpVersion(b.mc, a.mc));
}

function modVersions(mod, key) {
  return mod.versions.filter(v => mcKey(v) === key).sort((a, b) => cmpVersion(b.modVersion, a.modVersion));
}

const isFolder = n => Array.isArray(n.children);
function countItems(n) { return isFolder(n) ? n.children.reduce((a, c) => a + countItems(c), 0) : 1; }
// every entry with the folders that lead to it
function walk(nodes, path = [], out = []) {
  for (const n of nodes) { out.push({ node: n, path }); if (isFolder(n)) walk(n.children, [...path, n], out); }
  return out;
}

function renderMods() {
  const here = state.folder[state.folder.length - 1];
  const items = here ? here.children : CATALOG;
  stepTitle.textContent = here ? `${here.name}から選ぶ` : "MODを選ぶ";
  crumbs.hidden = !here;
  crumbs.innerHTML = "";
  if (here) {
    const go = (depth, label) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = label;
      b.addEventListener("click", () => openFolder(state.folder.slice(0, depth)));
      crumbs.appendChild(b);
      crumbs.appendChild(Object.assign(document.createElement("span"), { textContent: "/" }));
    };
    go(0, "MOD一覧");
    state.folder.slice(0, -1).forEach((f, i) => go(i + 1, f.name));
    crumbs.appendChild(Object.assign(document.createElement("span"), { className: "here", textContent: here.name }));
  }
  modList.innerHTML = "";
  for (const mod of items) {
    const btn = document.createElement("button");
    btn.type = "button";
    if (isFolder(mod)) {
      btn.className = "mod-card folder";
      btn.innerHTML = `<span class="name">${esc(mod.name)}</span><span class="sum">${esc(mod.summary)}</span><span class="chips"><span class="chip count">${countItems(mod)} 件</span></span>`;
      btn.addEventListener("click", () => openFolder([...state.folder, mod]));
      modList.appendChild(btn);
      continue;
    }
    btn.className = "mod-card";
    btn.setAttribute("aria-pressed", String(state.mod === mod));
    const mcs = mcOptions(mod).map(v => `<span class="chip">${esc(v.mc)} · ${esc(v.loader)}</span>`).join("");
    btn.innerHTML = `<span class="name">${esc(mod.name)}</span><span class="sum">${esc(mod.summary)}</span><span class="chips">${mcs}</span>`;
    btn.addEventListener("click", () => selectMod(mod, true));
    modList.appendChild(btn);
  }
}

function openFolder(path) {
  state.folder = path;
  state.mod = state.mc = state.version = null;
  const here = path[path.length - 1];
  try { history.replaceState(null, "", here ? "#" + here.id : location.pathname + location.search); } catch (e) { /* ignore */ }
  render();
  document.getElementById("s1").scrollIntoView({ behavior: "smooth", block: "start" });
}

function selectMod(mod, scroll) {
  state.mod = mod;
  state.mc = null;
  state.version = null;
  try { history.replaceState(null, "", "#" + mod.id); } catch (e) { /* ignore */ }
  render();
  if (scroll) document.getElementById("s2")?.scrollIntoView({ behavior: "smooth", block: "start" });
}

function clearSelection() {
  state.mod = state.mc = state.version = null;
  const here = state.folder[state.folder.length - 1];
  try { history.replaceState(null, "", here ? "#" + here.id : location.pathname + location.search); } catch (e) { /* ignore */ }
  render();
  modList.scrollIntoView({ behavior: "smooth", block: "start" });
}

function render() {
  renderMods();
  flow.innerHTML = "";
  const mod = state.mod;
  if (!mod) return;

  const wrap = document.createElement("div");
  wrap.style.display = "grid";
  wrap.style.gap = "28px";

  // mod details + Minecraft version
  const s2 = document.createElement("section");
  s2.className = "step";
  s2.setAttribute("aria-labelledby", "s2");
  const features = mod.features.map(([k, v]) => `<div class="feature"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join("");
  const notes = mod.notes.map(n => `<li>${esc(n)}</li>`).join("");
  s2.innerHTML = `
    <div class="details">
      <button class="back" type="button">← ${esc(state.folder.length ? state.folder[state.folder.length - 1].name : "MOD")}一覧に戻る</button>
      <h2 style="font-size:24px">${esc(mod.name)}</h2>
      <p class="hint" style="font-size:14px">${esc(mod.summary)}</p>
      <div style="display:grid;gap:8px">${features}</div>
      <ul class="hint" style="margin:0;padding-left:1.2em;display:grid;gap:2px">${notes}</ul>
    </div>
    <div class="step-head"><span class="step-no">STEP 2</span><h2 id="s2">Minecraft のバージョンを選ぶ</h2></div>
    <div class="options" id="mc-options"></div>`;
  s2.querySelector(".back").addEventListener("click", clearSelection);
  const mcBox = s2.querySelector("#mc-options");
  for (const v of mcOptions(mod)) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt";
    b.setAttribute("aria-pressed", String(state.mc === mcKey(v)));
    b.innerHTML = `${esc(v.mc)} <span class="sub">${esc(v.loader)}${v.loaderVersion ? " " + esc(v.loaderVersion) : ""}</span>`;
    b.addEventListener("click", () => {
      state.mc = mcKey(v);
      state.version = null;
      render();
      document.getElementById("s3")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    });
    mcBox.appendChild(b);
  }
  wrap.appendChild(s2);

  // mod version
  if (state.mc) {
    const versions = modVersions(mod, state.mc);
    const s3 = document.createElement("section");
    s3.className = "step";
    s3.innerHTML = `
      <div class="step-head"><span class="step-no">STEP 3</span><h2 id="s3">${mod.kind === "addon" ? "アドオン" : mod.kind === "datapack" ? "データパック" : "MOD"}の版を選ぶ</h2></div>
      <div class="options" id="ver-options"></div>`;
    const vBox = s3.querySelector("#ver-options");
    versions.forEach((v, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      b.setAttribute("aria-pressed", String(state.version === v));
      b.innerHTML = `v${esc(v.modVersion)} <span class="sub">${i === 0 ? "最新 · " : ""}${esc(v.released)}</span>`;
      b.addEventListener("click", () => {
        state.version = v;
        render();
        document.getElementById("s4")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
      vBox.appendChild(b);
    });
    wrap.appendChild(s3);
  }

  // download
  if (state.version) wrap.appendChild(downloadBlock(mod, state.version));

  flow.appendChild(wrap);
}

function downloadBlock(mod, v) {
  const fill = s => s.replace(/\{(\w+)\}/g, (_, k) => esc(v[k] ?? ""));
  const steps = mod.install.map(s => `<li>${fill(s)}</li>`).join("");
  const url = DL[v.file] || "";
  const saveName = url ? url.split("/").pop() : v.fileName;
  const isJar = /\.jar$/i.test(saveName);
  const renameNote = isJar
    ? `<p class="hint" style="margin:0;font-size:14px">ダウンロードされるのは jar ファイル（<code>${esc(saveName)}</code>）です。ZIPの展開は不要で、そのまま mods フォルダに入れてください。</p>`
    : "";
  const sec = document.createElement("section");
  sec.className = "step";
  sec.innerHTML = `
    <div class="step-head"><span class="step-no">STEP 4</span><h2 id="s4">ダウンロード</h2></div>
    <div class="download">
      <div class="row">
        ${url ? `<a class="dl" href="${esc(url)}" download="${esc(saveName)}">${esc(mod.name)} v${esc(v.modVersion)} をダウンロード</a>`
              : `<button class="dl" type="button" disabled>${esc(mod.name)} v${esc(v.modVersion)} をダウンロード</button>`}
        <span class="msg" aria-live="polite">${url ? "" : "この版のファイルは準備中です。"}</span>
      </div>
      <dl class="file">${mod.kind ? `
        <dt>対応</dt><dd>Minecraft ${mod.kind === "datapack" ? esc(v.mc) + "（データパック）" : esc(v.loader) + " " + esc(v.mc)}</dd>
        <dt>ファイル</dt><dd>${esc(v.fileName)}（${kb(v.fileBytes)}）</dd>
        <dt>SHA-256</dt><dd>${esc(v.sha256)}</dd>` : `
        <dt>対応</dt><dd>Minecraft ${esc(v.mc)} / ${esc(v.loader)} ${esc(v.loaderVersion)}</dd>
        <dt>ファイル</dt><dd>${esc(v.fileName)}（${kb(v.zipBytes)}）</dd>
        <dt>中身</dt><dd>${esc(v.jar)}（${v.jarBytes.toLocaleString("ja-JP")} バイト）</dd>
        <dt>jar の SHA-256</dt><dd>${esc(v.sha256)}</dd>`}
      </dl>
      ${renameNote}
      <h3 style="margin:0;font-size:15px">導入手順</h3>
      <ol class="steps">${steps}</ol>
    </div>`;
  return sec;
}

// open a mod or folder directly from #id
const initial = walk(CATALOG).find(e => "#" + e.node.id === location.hash);
if (!initial) render();
else if (isFolder(initial.node)) { state.folder = [...initial.path, initial.node]; render(); }
else { state.folder = initial.path; selectMod(initial.node, false); }
</script>
