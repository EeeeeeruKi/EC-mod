plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.140'
}

version = mod_version
group = 'io.github.eeeeeeruki.hyperponder'

base {
    archivesName = 'HyperlinkPonder-1.20.1-forge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    maven { url = 'https://maven.createmod.net' }
}

dependencies {
    implementation "net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"
}

legacyForge {
    version = project.forge_version
    runs {
        client {
            client()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
