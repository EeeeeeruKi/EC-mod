modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="EeeeeeruKi"
description='''
チャットで @プレイヤー名 / @OP / @everyone のメンションができるようになります。
メンションされた人には名前が色付きで表示され、ゲームが最前面にないときはWindowsの通知が届きます。
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="watut"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"
