modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="EeeeeeruKi"
description='''
進捗を1700個以上追加します。アイテム集め・モブ討伐・バイオームや構造物の探検・やり込み・ネタ系の進捗がどっさり入っています。報酬は経験値です。
v1.5.0 から、クラフトした回数・置いたブロックの数・使ったアイテム・やられた相手など「何かをした回数」の進捗も入っています（Iron's Spells のスクロールや AE2 の倉庫の容量にも対応）。
v1.6.0 から、全部のブロックの設置・採掘、全部のアイテム作り、効果・醸造・エンチャント・釣り・取引など、ほぼ全部の行動に進捗があります。エーテルなどの特別な音は設定でオフにできます。
v1.4.0 から、人気のMOD約100個（Create・Mekanism・AE2・黄昏の森・エーテル・Quark・Botania・Tinkers' Construct など）が入っていると、そのMODの進捗（合計約14000個）も追加されます。
v1.2.0 から、エーテルのタブの進捗のトーストが出たときに、エーテルの進捗の音が鳴ります。
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
