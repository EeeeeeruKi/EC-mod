authors="EeeeeeruKi"
description='''
進捗をどっさり追加するよ。アイテム集め・モブ討伐・探検・やり込み、全部のブロックの設置や採掘、効果・醸造・エンチャント・釣り・取引など、ほぼ全部の行動に進捗があるよ。歩いた・右を向いた・上を見たみたいな、ちょっとした行動の進捗もあるよ。報酬は経験値。入っているMOD（約150個に対応。ATM9 No Frills のMODもほとんど対応）の進捗も追加されるよ。
エーテルなどの特別な進捗の音は、設定でオフにできるよ。
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
