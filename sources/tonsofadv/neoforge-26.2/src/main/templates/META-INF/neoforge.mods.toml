進捗をどっさり追加するよ。アイテム集め・モブ討伐・探検・やり込み、全部のブロックの設置や採掘、効果・醸造・エンチャント・釣り・取引など、ほぼ全部の行動に進捗があるよ。歩いた・右を向いた・上を見たみたいな、ちょっとした行動の進捗もあるよ。報酬は経験値。入っているMOD（約100個に対応）の進捗も追加されるよ。
'''

