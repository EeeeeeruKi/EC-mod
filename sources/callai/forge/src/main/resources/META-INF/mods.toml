modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''/tell @ai でAI（Gemini または OpenAI互換API：OpenAI・Ollama・LM Studio など）にささやくと、ささやき返してくれるmodです。AIに頼むとコマンドも実行してくれます（/ai do）。サーバー必須、クライアントにも入れると @ai が補完され、画面の読み取りも使えます。'''
# サーバー必須。クライアントは入れなくても入れますが、入れると @ai が補完されます
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
