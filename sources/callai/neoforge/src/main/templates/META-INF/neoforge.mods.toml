modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="EeeeeeruKi"
description='''/tell @ai でAI（Gemini または OpenAI互換API：OpenAI・Ollama・LM Studio など）にささやくと、ささやき返してくれるmodです。AIに頼むとコマンドも実行してくれます（/ai do）。サーバー必須、クライアントにも入れると @ai が補完され、画面の読み取りも使えます。'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
