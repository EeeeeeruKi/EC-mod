plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = "${mod_version}"
group = 'com.eeeeeeruki.claudeupdater'

base {
    archivesName = "claudeupdater"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {}
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/mods.toml') {
        expand 'version': version
    }
}

jar {
    archiveFileName = "claudeupdater-${version}-forge-${minecraft_version}.jar"
    manifest {
        attributes([
            'Specification-Title'   : 'claudeupdater',
            'Specification-Vendor'  : 'EeeeeeruKi',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'Claude MOD Updater',
            'Implementation-Version': version,
            'Implementation-Vendor' : 'EeeeeeruKi'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
