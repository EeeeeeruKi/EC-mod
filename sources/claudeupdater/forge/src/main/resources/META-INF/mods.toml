入れ替えはゲームを終了したあとに行われ、次の起動から新しい版になります。
タイトル画面で Ctrl+U を押すか、更新ボタン（矢印のアイコン）か、MOD一覧の「設定」ボタンから、いつでも確認し直せます。
'''

