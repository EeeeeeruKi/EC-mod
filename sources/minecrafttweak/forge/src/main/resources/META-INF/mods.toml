modLoader="javafml"
loaderVersion="[47,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="EeeeeeruKi"
description='''
Quark を前提にして、Quark にない小さな改善をたくさん詰め込むためのMODです。
機能は最初はすべてオフです。MOD一覧の「設定」、または設定コード（例: 1-t,1a-0）のインポートで変更できます。
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="quark"
    mandatory=true
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
