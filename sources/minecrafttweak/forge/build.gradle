plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
        }
    }
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // バニラのクラスに入れる mixin の名前の対応表（refmap）を作る
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // 英語でも検索: JEI と EMI の API（別名の登録）。ゲームに入っていなければ使われない
    // JEI と EMI（英語でも検索の連携用）。Modrinth の Maven から取る
    compileOnly "maven.modrinth:jei:3ehcytyv"
    // Mekanism（エネルギーキューブを重ねる機能の mixin 用）
    compileOnly "maven.modrinth:mekanism:uxe1WQp4"
    compileOnly "maven.modrinth:emi:Axuu9I9R"
}

mixin {
    add sourceSets.main, 'minecrafttweak.refmap.json'
    config 'minecrafttweak.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id     : mod_id,
            mod_name   : mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : 'EeeeeeruKi',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'EeeeeeruKi',
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
